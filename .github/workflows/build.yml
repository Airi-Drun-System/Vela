name: Build
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
      - run: npm run build
      - run: npx electron-builder --win nsis --publish always
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false, GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  android:
    runs-on: ubuntu-latest
    env: { VB: "${{ github.run_number }}", VV: "0.1.${{ github.run_number }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci --ignore-scripts
      - run: npm run build && node mobile/build.js
      - run: npx cap add android && node mobile/patch.js
      - name: Icons
        run: |
          set -e
          command -v convert || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          R=android/app/src/main/res; rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}
            convert build/icon.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png; cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png; rm -f $R/mipmap-$n/ic_launcher_foreground.png; done
          for f in $(find $R -name splash.png); do w=$(identify -format %w $f); h=$(identify -format %h $f); i=$(( (w<h?w:h)/3 ))
            convert -size ${w}x${h} xc:'#14161D' \( build/icon.png -resize ${i}x${i} \) -gravity center -composite $f; done
      - name: Signing key
        env: { KS: "${{ secrets.LN_DEBUG_KEYSTORE }}" }
        run: |
          if [ -z "$KS" ]; then echo "::warning::Нет секрета LN_DEBUG_KEYSTORE"; echo "HAS_KEY=false" >> $GITHUB_ENV; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ln.keystore"; echo "LN_KEYSTORE=$RUNNER_TEMP/ln.keystore" >> $GITHUB_ENV; echo "HAS_KEY=true" >> $GITHUB_ENV
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Vela-android.apk
      - uses: softprops/action-gh-release@v2
        if: env.HAS_KEY == 'true'
        with: { tag_name: android, name: "Vela — Android", prerelease: true, make_latest: false, target_commitish: "${{ github.sha }}", files: Vela-android.apk }
